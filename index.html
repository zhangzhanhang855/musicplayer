<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JRmusic - Apple Music Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://gs.jurieo.com/gemini/fonts-googleapis/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            min-height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #app-container { width: 100vw; height: 100vh; box-sizing: border-box; }
        #win-content-main { width: 100%; height: 100%; position: relative; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="win-content-main"></div>
    </div>

    <script>
        const winObj = { id: 'main', onDestroy: () => {} };
        const content = document.getElementById('win-content-' + winObj.id);

        // ==========================================
        // 1. 样式表注入 (Apple Music 质感与歌词特效)
        // ==========================================
        const styleEl = document.createElement('style');
        styleEl.innerHTML = `
            #win-content-${winObj.id} {
                --am-red: #fa233b;
                --am-bg: rgba(0, 0, 0, 0.4);
                height: 100%; 
            }
            
            /* 动态高斯模糊背景 */
            .am-bg-blur {
                position: absolute;
                inset: -10%;
                background-size: cover;
                background-position: center;
                filter: blur(60px) brightness(0.4) saturate(1.5);
                z-index: 0;
                transition: background-image 0.8s ease-in-out;
            }

            /* 主体布局 */
            .am-layout {
                position: relative;
                z-index: 10;
                display: flex;
                flex-direction: column;
                height: 100%;
                width: 100%;
            }
            @media (min-width: 768px) {
                .am-layout { flex-direction: row; }
            }

            /* 左侧播放器面板 */
            .am-player-panel {
                background: var(--am-bg);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-right: 1px solid rgba(255,255,255,0.05);
                display: flex;
                flex-direction: column;
            }

            /* 专辑封面 */
            .am-cover-art {
                width: 100%;
                aspect-ratio: 1/1;
                border-radius: 12px;
                background-color: #1a1a1a;
                background-size: cover;
                background-position: center;
                box-shadow: 0 20px 40px rgba(0,0,0,0.4);
                transition: opacity 0.5s ease, transform 0.3s ease;
                position: relative;
                overflow: hidden;
            }
            .am-cover-art.playing {
                transform: scale(1.02);
            }

            /* 歌词区域遮罩 (上下渐隐) */
            .lyrics-mask { 
                -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 15%, #000 85%, transparent 100%); 
                mask-image: linear-gradient(180deg, transparent 0%, #000 15%, #000 85%, transparent 100%); 
            }

            /* 沉浸式歌词排版 */
            .lyric-line { 
                transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); 
                color: rgba(255, 255, 255, 0.4); 
                padding: 12px 0; 
                font-size: 24px; 
                font-weight: 700;
                line-height: 1.3; 
                cursor: pointer; 
                transform-origin: left center;
                filter: blur(0.5px);
                text-align: left;
                width: 100%;
            }
            @media (min-width: 768px) {
                .lyric-line { font-size: 32px; }
            }
            
            .lyric-line:hover { 
                color: rgba(255, 255, 255, 0.8); 
            }
            
            .lyric-line.active { 
                color: #ffffff; 
                font-size: 32px; 
                transform: scale(1.05); 
                filter: blur(0px);
                text-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            }
            @media (min-width: 768px) {
                .lyric-line.active { font-size: 44px; }
            }
            
            /* 自定义进度条 UI 隐藏（保留数据结构） */
            .hidden-ui { display: none !important; }
            
            /* 列表激活态 */
            .track-active {
                background: rgba(250, 35, 59, 0.15);
                color: var(--am-red);
                font-weight: 600;
            }
        `;
        content.appendChild(styleEl);

        // ==========================================
        // 2. HTML 骨架 (Apple Music 布局)
        // ==========================================
        content.innerHTML += `
        <!-- 动态背景层 -->
        <div id="dynamic-bg" class="am-bg-blur"></div>
        
        <div class="am-layout">
            <!-- 左侧：播放器与库 -->
            <section class="am-player-panel w-full md:w-[380px] lg:w-[420px] flex-shrink-0 p-6 md:p-8 flex flex-col h-[50vh] md:h-full z-10">
                
                <!-- 专辑封面 -->
                <div class="relative w-full max-w-[300px] mx-auto mb-6">
                    <div id="cover-art-${winObj.id}" class="am-cover-art opacity-0"></div>
                    <span class="absolute inset-0 flex items-center justify-center text-6xl pointer-events-none" id="cover-emoji">🎵</span>
                </div>

                <!-- 歌曲信息 -->
                <div class="mb-6 text-center md:text-left">
                    <h2 class="text-2xl font-bold text-white truncate tracking-tight" id="title">Not Playing</h2>
                    <div class="flex items-center justify-center md:justify-start gap-2 mt-2">
                        <span class="text-sm font-semibold text-white/50 bg-white/10 px-2 py-0.5 rounded" id="lcd-mode">LIST</span>
                        <span class="text-sm font-medium text-white/60">JRmusic Engine</span>
                    </div>
                </div>

                <!-- 控制栏 -->
                <div class="flex flex-col mb-6">
                    <div class="flex justify-between text-xs text-white/50 font-medium mb-4 px-2">
                        <span id="cur-time">00:00:00</span>
                        <button id="mode-btn" class="hover:text-white transition-colors">MODE</button>
                    </div>
                    
                    <div class="flex justify-center items-center gap-8">
                        <button class="w-12 h-12 flex items-center justify-center text-white/50 hover:text-white transition-colors" onclick="btnMode.click()">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                        </button>
                        
                        <button class="w-16 h-16 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition-transform shadow-lg" id="btn-play">
                            <!-- 播放图标(CSS画的，后续在JS里切换) -->
                            <div class="w-0 h-0 border-y-[10px] border-y-transparent border-l-[16px] border-l-black ml-1" id="play-icon"></div>
                        </button>
                        
                        <button class="w-12 h-12 flex items-center justify-center text-white hover:text-white/70 transition-colors" id="btn-next">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4z"/><path d="M15 4h4v16h-4z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- 播放列表区域 (紧凑滚动) -->
                <div class="flex-1 flex flex-col min-h-0 bg-black/20 rounded-xl overflow-hidden border border-white/5">
                    <div class="p-3 border-b border-white/5 bg-black/20">
                        <div class="flex gap-2">
                            <input class="flex-1 bg-white/10 border border-transparent rounded px-2 py-1.5 text-xs outline-none focus:border-white/20 text-white transition-colors placeholder-white/30" id="gh-user" placeholder="GitHub User" type="text">
                            <input class="flex-1 bg-white/10 border border-transparent rounded px-2 py-1.5 text-xs outline-none focus:border-white/20 text-white transition-colors placeholder-white/30" id="gh-repo" placeholder="Repository" type="text">
                            <button class="px-3 bg-[#fa233b] text-white rounded text-xs font-semibold hover:bg-rose-600 transition-colors" id="btn-sync">SYNC</button>
                        </div>
                    </div>
                    
                    <div class="px-3 pt-3">
                        <input class="w-full bg-white/5 border border-transparent rounded-lg p-2 text-xs outline-none focus:bg-white/10 text-white placeholder-white/30 transition-colors" id="search-input" placeholder="Search tracks..." type="text">
                        <div class="flex gap-2 overflow-x-auto no-scrollbar mt-3 pb-1" id="playlist-nav"></div>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto no-scrollbar p-2">
                        <ul id="track-list" class="space-y-1"></ul>
                    </div>
                    
                    <div class="p-2 text-center bg-black/40">
                        <p class="text-[10px] text-white/40 font-medium" id="net-status">System Standby</p>
                    </div>
                </div>
            </section>

            <!-- 右侧：沉浸式歌词 -->
            <section class="flex-1 flex flex-col h-[50vh] md:h-full relative z-10 pl-6 pr-6 md:pl-12 md:pr-12 pt-8">
                <div class="absolute top-6 right-6 md:top-8 md:right-12 z-20">
                    <span class="text-[10px] md:text-xs font-bold text-white/30 uppercase tracking-widest bg-black/20 px-3 py-1 rounded-full backdrop-blur-sm" id="lyrics-status">LYRICS SYSTEM</span>
                </div>
                
                <div class="flex-1 relative w-full overflow-hidden lyrics-mask">
                    <div id="lyrics-container-${winObj.id}" class="absolute inset-0 overflow-y-auto no-scrollbar" style="scroll-behavior: smooth;">
                        <!-- 加大 padding 确保上下滚动留白 -->
                        <div id="lyrics-content-${winObj.id}" class="w-full max-w-3xl mx-auto pb-[60vh] pt-[40vh] flex flex-col px-4">
                            <div class="text-left text-white/30 text-lg md:text-xl font-medium mt-10 tracking-widest">
                                Loading Apple Music Lyrics...
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <audio id="player-audio-${winObj.id}" playsinline></audio>`;

        // ==========================================
        // 3. 状态初始化 (保持原有逻辑)
        // ==========================================
        const audio = content.querySelector('#player-audio-' + winObj.id);
        const titleEl = content.querySelector('#title');
        const curTimeEl = content.querySelector('#cur-time');
        const playIcon = content.querySelector('#play-icon');
        const btnPlay = content.querySelector('#btn-play');
        const btnNext = content.querySelector('#btn-next');
        const btnMode = content.querySelector('#mode-btn');
        const lcdMode = content.querySelector('#lcd-mode');
        const navContainer = content.querySelector('#playlist-nav');
        const listContainer = content.querySelector('#track-list');
        const searchInput = content.querySelector('#search-input');
        const artEl = content.querySelector('#cover-art-' + winObj.id);
        const dynBgEl = content.querySelector('#dynamic-bg');
        const emjEl = content.querySelector('#cover-emoji');
        const netStatus = content.querySelector('#net-status');
        const ghUserInp = content.querySelector('#gh-user');
        const ghRepoInp = content.querySelector('#gh-repo');
        const btnSync = content.querySelector('#btn-sync');
        
        const lyricsContainerEl = content.querySelector(`#lyrics-container-${winObj.id}`);
        const lyricsContentEl = content.querySelector(`#lyrics-content-${winObj.id}`);
        const lyricsStatusEl = content.querySelector('#lyrics-status');

        let playlists = {};
        let currentPlaylist = 'Root';
        let filteredTracks = [];
        let curIdx = 0;
        let loopMode = 'list';
        let currentCoverObjectURL = null;
        
        let parsedLyrics = [];
        let currentLyricIndex = -1;
        let isSyncedLyrics = false;

        // 新增：全局保存当前曲目元数据，用于控制中心状态恢复
        let currentTrackMeta = { title: '', artist: 'JRmusic', album: 'Local Music', coverUrl: null };

        const savedUser = localStorage.getItem('jrmusic_gh_user') || 'zhangzhanhang855';
        const savedRepo = localStorage.getItem('jrmusic_gh_repo') || 'musiconly';
        ghUserInp.value = savedUser;
        ghRepoInp.value = savedRepo;

        if (!window.jsmediatags) {
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js';
            document.head.appendChild(script);
        }

        // ==========================================
        // 4. 暴力解析底层 (完全不变)
        // ==========================================
        function aggressivelyFindLyrics(tags) {
            if (!tags) return "";

            const extract = (obj) => {
                if (!obj) return "";
                if (typeof obj === 'string') return obj;
                if (typeof obj.text === 'string') return obj.text;
                if (typeof obj.lyrics === 'string') return obj.lyrics;
                if (obj.data) {
                    if (typeof obj.data === 'string') return obj.data;
                    if (typeof obj.data.text === 'string') return obj.data.text;
                }
                return "";
            };

            let primary = extract(tags.lyrics) || extract(tags.USLT) || extract(tags.SYLT);
            if (primary && primary.includes('[')) return primary;

            for (let key in tags) {
                const item = tags[key];
                const arr = Array.isArray(item) ? item : [item];
                
                for (let i of arr) {
                    let txt = extract(i);
                    if (typeof txt === 'string' && txt.includes('[00:')) return txt;
                    
                    if (i && i.data) {
                        let deepTxt = extract(i.data.data) || extract(i.data);
                        if (typeof deepTxt === 'string' && deepTxt.includes('[00:')) return deepTxt;
                    }
                }
            }
            return primary; 
        }

        // ==========================================
        // 5. 歌词时间轴处理引擎 (完全不变，仅修改输出的HTML Class)
        // ==========================================
        function processLyrics(rawText, source) {
            if (!rawText || typeof rawText !== 'string') {
                parsedLyrics = [];
                isSyncedLyrics = false;
                lyricsStatusEl.innerText = "INSTRUMENTAL";
                lyricsContentEl.innerHTML = '<div class="text-left text-white/30 text-xl font-medium mt-10 tracking-widest">纯音乐 / Instrumental</div>';
                return;
            }
            
            const cleanText = rawText.replace(/\0/g, '').trim();
            const lines = cleanText.split(/\r?\n/);
            
            const timeReg = /\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
            parsedLyrics = [];
            
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                
                let match;
                let timeTags = [];
                timeReg.lastIndex = 0; 
                
                while ((match = timeReg.exec(line)) !== null) {
                    const m = parseInt(match[1], 10);
                    const s = parseInt(match[2], 10);
                    const msStr = match[3] || '0';
                    const ms = parseInt(msStr.padEnd(3, '0').slice(0, 3), 10);
                    timeTags.push(m * 60 + s + ms / 1000);
                }
                
                if (timeTags.length > 0) {
                    let text = line.replace(/\[\d{1,3}:\d{1,2}(?:[.:]\d{1,3})?\]/g, '').trim();
                    let translation = '';
                    
                    // 匹配诸如 "（翻译：你好）" 或 "(翻译: hello)" 的格式
                    const transMatch = text.match(/[（(]翻译[：:]\s*(.*?)[）)]/);
                    if (transMatch) {
                        translation = transMatch[1].trim(); // 提取翻译内容
                        text = text.replace(transMatch[0], '').trim(); // 从主歌词中剔除翻译标签
                    }
                    
                    for (let t of timeTags) {
                        parsedLyrics.push({ time: t, text: text || '...', translation: translation });
                    }
                }
            }
            
            if (parsedLyrics.length > 0) {
                isSyncedLyrics = true;
                lyricsStatusEl.innerText = `${source}`;
                
                parsedLyrics.sort((a, b) => a.time - b.time);
                
                lyricsContentEl.innerHTML = parsedLyrics.map((l, i) => 
                    `<div class="lyric-line" id="lyric-${i}" data-time="${l.time}">
                        <span class="block">${l.text}</span>
                        ${l.translation ? `<span class="block text-[0.65em] opacity-75 mt-2 font-normal">${l.translation}</span>` : ''}
                    </div>`
                ).join('');
                
                lyricsContentEl.style.paddingTop = '40vh';
                lyricsContentEl.style.paddingBottom = '60vh';
                
                lyricsContentEl.querySelectorAll('.lyric-line').forEach(el => {
                    el.onclick = () => {
                        audio.currentTime = parseFloat(el.getAttribute('data-time'));
                        if (audio.paused) audio.play();
                    };
                });
            } else {
                isSyncedLyrics = false;
                lyricsStatusEl.innerText = `TEXT [${source}]`;
                lyricsContentEl.style.paddingTop = '10vh';
                lyricsContentEl.style.paddingBottom = '10vh';
                lyricsContentEl.innerHTML = `<div class="text-left text-white/50 text-xl whitespace-pre-wrap leading-loose px-2">${cleanText}</div>`;
            }
        }

        // ==========================================
        // 6. 核心播放与抓取控制 (完全不变)
        // ==========================================
        const updateMediaSession = (lyricText = null) => {
            if ('mediaSession' in navigator) {
                // 黑科技：如果传入了歌词，则在控制中心的“歌手”位置显示歌词，否则显示真实歌手名
                const displayArtist = lyricText ? lyricText : currentTrackMeta.artist;
                
                navigator.mediaSession.metadata = new MediaMetadata({ 
                    title: currentTrackMeta.title, 
                    artist: displayArtist, 
                    album: currentTrackMeta.album, 
                    artwork: currentTrackMeta.coverUrl ? [{ src: currentTrackMeta.coverUrl, sizes: '512x512', type: 'image/jpeg' }] : [] 
                });
                
                navigator.mediaSession.setActionHandler('play', () => audio.play());
                navigator.mediaSession.setActionHandler('pause', () => audio.pause());
                navigator.mediaSession.setActionHandler('previoustrack', () => executeLoad((curIdx - 1 + filteredTracks.length) % filteredTracks.length, true));
                navigator.mediaSession.setActionHandler('nexttrack', () => btnNext.click());
            }
        };

        const filterAudio = (items) => {
            const audioRegex = /\.(mp3|flac|wav|m4a)$/i;
            const extRegex = /\.[^/.]+$/;
            return items.filter(f => audioRegex.test(f.name)).map(f => ({
                t: f.name.replace(extRegex, ''), u: f.download_url
            }));
        };

        const renderNav = () => {
            navContainer.innerHTML = Object.keys(playlists).map(name => `<button class="text-xs px-3 py-1 bg-white/10 rounded-full hover:bg-white/20 transition-colors whitespace-nowrap btn-nav" data-name="${name}">${name}</button>`).join('');
            navContainer.querySelectorAll('.btn-nav').forEach(btn => btn.onclick = () => switchPlaylist(btn.dataset.name));
        };

        const renderList = () => {
            listContainer.innerHTML = filteredTracks.map((s, i) => {
                const isActive = curIdx === i;
                const activeClass = isActive ? 'track-active' : 'text-white/60 hover:bg-white/5';
                const playingAnim = isActive && !audio.paused ? `<span class="inline-block w-1.5 h-1.5 bg-[#fa233b] rounded-full animate-pulse ml-2"></span>` : '';
                return `<li class="p-3 text-xs md:text-sm rounded-lg cursor-pointer transition-colors ${activeClass}" data-idx="${i}">
                    <span class="opacity-50 mr-2">${String(i + 1).padStart(2, '0')}</span>${s.t} ${playingAnim}
                </li>`;
            }).join('');
            listContainer.querySelectorAll('li').forEach(item => item.onclick = () => executeLoad(parseInt(item.dataset.idx), true));
        };

        const switchPlaylist = (name) => {
            currentPlaylist = name;
            filteredTracks = [...playlists[name]];
            renderList();
            if (filteredTracks.length > 0) executeLoad(0, false);
        };

        const executeLoad = (idx, auto) => {
            if (filteredTracks.length === 0) return;
            curIdx = idx;
            const song = filteredTracks[curIdx];
            
            audio.src = song.u;
            audio.load();
            titleEl.innerText = song.t;

            // 初始化当前曲目元数据（备用，等待 ID3 标签填充）
            currentTrackMeta = {
                title: song.t,
                artist: 'JRmusic',
                album: currentPlaylist,
                coverUrl: null
            };

            artEl.classList.remove('loaded', 'opacity-100');
            artEl.classList.add('opacity-0');
            artEl.style.backgroundImage = 'none';
            dynBgEl.style.backgroundImage = 'none';
            emjEl.style.opacity = '1';
            
            currentLyricIndex = -1;
            processLyrics(null, '');
            lyricsContainerEl.scrollTo({ top: 0, behavior: 'auto' });

            if (currentCoverObjectURL) {
                URL.revokeObjectURL(currentCoverObjectURL);
                currentCoverObjectURL = null;
            }

            updateMediaSession(); // 初始更新控制中心
            if (auto) audio.play().catch(e => console.log('Wait gesture:', e));
            else renderList(); // Update UI list for inactive click

            let lyricsFound = false;

            const lrcUrl = song.u.replace(/\.(mp3|flac|wav|m4a)$/i, '.lrc');
            fetch(lrcUrl)
                .then(res => { if (res.ok) return res.text(); throw new Error(); })
                .then(lrcText => {
                    if (lrcText && lrcText.trim()) {
                        lyricsFound = true;
                        processLyrics(lrcText, 'LRC FILE');
                    }
                })
                .catch(e => {});

            fetch(song.u)
                .then(res => { if (!res.ok) throw new Error(); return res.blob(); })
                .then(audioBlob => {
                    if (!window.jsmediatags) return;
                    new window.jsmediatags.Reader(audioBlob).read({
                        onSuccess: (tag) => {
                            // 提取更丰富的 ID3 信息以完善控制中心显示
                            if (tag.tags.title) {
                                currentTrackMeta.title = tag.tags.title;
                                titleEl.innerText = tag.tags.title; // 同步更新网页端 UI 歌名
                            }
                            if (tag.tags.artist) currentTrackMeta.artist = tag.tags.artist;
                            if (tag.tags.album) currentTrackMeta.album = tag.tags.album;

                            const pic = tag.tags.picture;
                            if (pic) {
                                const byteArray = new Uint8Array(pic.data);
                                const coverBlob = new Blob([byteArray], { type: pic.format });
                                currentCoverObjectURL = URL.createObjectURL(coverBlob);
                                currentTrackMeta.coverUrl = currentCoverObjectURL; // 存入控制中心元数据
                                
                                artEl.style.backgroundImage = `url(${currentCoverObjectURL})`;
                                dynBgEl.style.backgroundImage = `url(${currentCoverObjectURL})`;
                                
                                artEl.classList.remove('opacity-0');
                                artEl.classList.add('opacity-100');
                                emjEl.style.opacity = '0';
                            }
                            
                            updateMediaSession(); // ID3 解析完成后，立即更新一次系统控制中心封面和名字

                            if (!lyricsFound) {
                                const aggressiveLrcText = aggressivelyFindLyrics(tag.tags);
                                if (aggressiveLrcText) {
                                    processLyrics(aggressiveLrcText, 'ID3 TAG');
                                }
                            }
                        },
                        onError: () => {}
                    });
                })
                .catch(err => {});
        };

        audio.onended = () => {
            if (filteredTracks.length === 0) return;
            if (loopMode === 'single') executeLoad(curIdx, true);
            else if (loopMode === 'random') {
                let nextIndex = Math.floor(Math.random() * filteredTracks.length);
                if (filteredTracks.length > 1 && nextIndex === curIdx) nextIndex = (nextIndex + 1) % filteredTracks.length;
                executeLoad(nextIndex, true);
            } else {
                executeLoad((curIdx + 1) % filteredTracks.length, true);
            }
        };

        btnPlay.onclick = () => { audio.paused ? audio.play() : audio.pause(); };
        btnNext.onclick = () => { executeLoad((curIdx + 1 + filteredTracks.length) % filteredTracks.length, true); };

        audio.onplay = () => { 
            artEl.classList.add('playing');
            // CSS 画的双竖线（暂停图标）
            playIcon.className = 'w-3 h-4 border-l-[4px] border-r-[4px] border-black ml-0'; 
            renderList();
        };
        audio.onpause = () => { 
            artEl.classList.remove('playing');
            // CSS 画的三角形（播放图标）
            playIcon.className = 'w-0 h-0 border-y-[8px] border-y-transparent border-l-[14px] border-l-black ml-1'; 
            renderList();
        };
        
        audio.ontimeupdate = () => {
            let s = audio.currentTime;
            if (isNaN(s)) { curTimeEl.innerText = '00:00'; return; }
            let m = Math.floor(s / 60), sec = Math.floor(s % 60);
            curTimeEl.innerText = m.toString().padStart(2, '0') + ':' + sec.toString().padStart(2, '0');
            
            if (isSyncedLyrics && parsedLyrics.length > 0) {
                let activeIdx = -1;
                for (let i = 0; i < parsedLyrics.length; i++) {
                    if (s >= parsedLyrics[i].time) activeIdx = i;
                    else break;
                }
                
                if (activeIdx !== currentLyricIndex) {
                    lyricsContentEl.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
                    if (activeIdx !== -1) {
                        const currEl = lyricsContentEl.querySelector(`#lyric-${activeIdx}`);
                        if (currEl) {
                            currEl.classList.add('active');
                            const container = lyricsContainerEl;
                            // 滚动偏移量计算：让当前歌词居中偏上一点
                            const scrollPos = currEl.offsetTop - (container.clientHeight / 2) + (currEl.clientHeight / 2);
                            container.scrollTo({ top: scrollPos, behavior: 'smooth' });
                            
                            // NEW: 将当前歌词和翻译实时推送到系统控制中心（替换歌手名位置）
                            const currentLine = parsedLyrics[activeIdx];
                            const displayText = currentLine.translation ? `${currentLine.text} - ${currentLine.translation}` : currentLine.text;
                            updateMediaSession(displayText);
                        }
                    } else {
                        // 间奏或无歌词时恢复显示原始歌手名
                        updateMediaSession();
                    }
                    currentLyricIndex = activeIdx;
                }
            }
        };

        searchInput.oninput = () => {
            const val = searchInput.value.toLowerCase();
            filteredTracks = playlists[currentPlaylist].filter(s => s.t.toLowerCase().includes(val));
            renderList();
        };

        btnMode.onclick = () => { 
            const modes = ['list', 'random', 'single']; 
            loopMode = modes[(modes.indexOf(loopMode) + 1) % modes.length]; 
            lcdMode.innerText = loopMode.toUpperCase();
        };

        async function loadLibrary(user, repo) {
            try {
                audio.pause(); audio.src = ''; curTimeEl.innerText = '00:00';
                playlists = {}; filteredTracks = []; listContainer.innerHTML = ''; navContainer.innerHTML = '';
                titleEl.innerText = 'Loading Repo...'; netStatus.innerText = `CONNECTING...`;
                
                const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/`);
                if (!res.ok) throw new Error('API LIMIT OR REPO NOT FOUND');
                
                const items = await res.json();
                playlists['Root'] = filterAudio(items);
                
                const folders = items.filter(i => i.type === 'dir');
                for (let f of folders) {
                    netStatus.innerText = `FETCHING DIR: ${f.name}`;
                    const subData = await (await fetch(f.url)).json();
                    const tracks = filterAudio(subData);
                    if(tracks.length > 0) playlists[f.name] = tracks;
                }
                
                netStatus.innerText = 'ONLINE';
                localStorage.setItem('jrmusic_gh_user', user);
                localStorage.setItem('jrmusic_gh_repo', repo);
                
                renderNav(); switchPlaylist('Root');
            } catch (e) {
                titleEl.innerText = 'Connection Error'; netStatus.innerText = 'SYNC FAILED - CHECK REPO OR API';
            }
        }
        
        btnSync.onclick = () => { const u = ghUserInp.value.trim(); const r = ghRepoInp.value.trim(); if(u && r) loadLibrary(u, r); };
        loadLibrary(savedUser, savedRepo);

        winObj.onDestroy = () => {
            audio.pause(); audio.src = '';
            if (currentCoverObjectURL) URL.revokeObjectURL(currentCoverObjectURL);
        };
    </script>
</body>
</html>
